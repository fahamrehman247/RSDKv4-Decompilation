name: Build RSDKv4 for PortMaster

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Critical for RSDKv4's dependencies

    - name: Install ARM64 Cross-Compiler and Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                               libsdl2-dev libogg-dev libvorbis-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DRETRO_REVISION=3 \
          -DRETRO_USE_HW_RENDER=OFF \
          -DRETRO_DISABLE_PLUS=OFF \
          -DCMAKE_EXE_LINKER_FLAGS="-pthread"

    - name: Build Project
      run: |
        cmake --build build --config Release -j$(nproc)

    - name: Upload Binary Artifact
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: RSDKv4-PortMaster-ARM64
        path: build/RSDKv4
