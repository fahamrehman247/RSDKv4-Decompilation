name: Build RSDKv4 for PortMaster

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    # Use GitHub's native ARM64 Ubuntu runner to eliminate repo resolution errors
    runs-on: ubuntu-24.04-arm64

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Native ARM64 Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config \
                               libsdl2-dev libogg-dev libvorbis-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DRETRO_REVISION=3 \
          -DRETRO_USE_HW_RENDER=OFF \
          -DRETRO_DISABLE_PLUS=OFF \
          -DCMAKE_EXE_LINKER_FLAGS="-pthread"

    - name: Build Project
      run: |
        cmake --build build --config Release -j$(nproc)

    - name: Upload Binary Artifact
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: RSDKv4-PortMaster-ARM64
        path: build/RSDKv4
