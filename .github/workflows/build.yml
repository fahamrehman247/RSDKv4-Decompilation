name: Build Sonic 2 RSDKv4 for PortMaster

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure Native Multi-Arch Repositories (DEB822 Format)
      run: |
        sudo dpkg --add-architecture arm64
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's/Architectures: amd64/Architectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
        fi
        CODENAME=$(lsb_release -sc)
        echo -e "Types: deb\nURIs: http://ubuntu.com\nSuites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-security\nComponents: main universe restricted multiverse\nArchitectures: arm64\n" | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources

    - name: Install Toolchains and ARM64 Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          cmake \
          pkg-config \
          zip \
          libsdl2-dev:arm64 \
          libvorbis-dev:arm64 \
          libogg-dev:arm64 \
          libglew-dev:arm64

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DRETRO_REVISION=3 \
          -DRETRO_USE_HW_RENDER=ON \
          -DRETRO_FORCE_GLES2=ON \
          -DRETRO_DISABLE_PLUS=OFF \
          -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config \
          -DCMAKE_FIND_ROOT_PATH=/usr/lib/aarch64-linux-gnu

    - name: Build Project
      run: |
        cmake --build build --config Release -j$(nproc)

    - name: Structure PortMaster Distribution
      run: |
        # Create standard layout structure
        mkdir -p dist/ports/sonic2
        
        # Move the compiled engine binary into the subdirectory
        cp build/RSDKv4 dist/ports/sonic2/
        
        # Generate the standard PortMaster launch script
        cat << 'EOF' > dist/ports/Sonic2.sh
        #!/bin/bash
        
        XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
        GAMEDIR="/roms/ports/sonic2"
        cd "$GAMEDIR"
        
        # Redirect standard output streams to debug files
        exec > >(tee "$GAMEDIR/log.txt") 2>&1
        
        # Bind controller schemes
        [[ -f /control.txt ]] && source /control.txt
        control_setup
        
        # Run Sonic 2
        ./RSDKv4
        
        # Cleanly restart the system interface on termination
        systemctl restart emulationstation || systemctl restart essway.service || killall -q frontend.sh
        EOF
        
        chmod +x dist/ports/Sonic2.sh

    - name: Compress Port Package Archive
      run: |
        cd dist
        zip -r ../Sonic2-PortMaster-ARM64.zip ports/

    - name: Upload Complete Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Sonic2-PortMaster-ARM64-Bundle
        path: Sonic2-PortMaster-ARM64.zip
