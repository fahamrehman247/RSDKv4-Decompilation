name: Build RSDKv4 for PortMaster

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure Native Multi-Arch Repositories
      run: |
        # 1. Enable ARM64 architecture support on the host system
        sudo dpkg --add-architecture arm64

        # 2. Re-route default repositories to handle both x86_64 and arm64 architectures safely
        sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list.d/* || true
        sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list || true

        # 3. Append the official Ubuntu Ports mirror mapped specifically for arm64 packages
        # (Matches the specific OS version running on the host image automatically)
        CODENAME=$(lsb_release -sc)
        echo "deb [arch=arm64] http://ubuntu.com ${CODENAME} main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ubuntu.com ${CODENAME}-updates main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list

    - name: Install Toolchains and ARM64 Dependencies
      run: |
        sudo apt-get update
        # Install the cross-compilers along with native ARM64 development packages
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          cmake \
          pkg-config \
          libsdl2-dev:arm64 \
          libvorbis-dev:arm64 \
          libogg-dev:arm64 \
          libglew-dev:arm64

    - name: Configure CMake
      run: |
        # Cross-build configurations utilizing standard system search trees via Pkg-Config
        cmake -B build \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DRETRO_REVISION=3 \
          -DRETRO_USE_HW_RENDER=ON \
          -DRETRO_FORCE_GLES2=ON \
          -DRETRO_DISABLE_PLUS=OFF \
          -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config \
          -DCMAKE_FIND_ROOT_PATH=/usr/lib/aarch64-linux-gnu

    - name: Build Project
      run: |
        cmake --build build --config Release -j$(nproc)

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RSDKv4-PortMaster-ARM64
        path: build/RSDKv4
